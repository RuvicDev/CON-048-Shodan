[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-shodan-connector"
version = "1.0.0"
description = "Conector Ruvic para Shodan: consultar información de una IP, buscar dispositivos/servicios expuestos por término, y obtener los puertos abiertos de un host"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_shodan_connector*"]
